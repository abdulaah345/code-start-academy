// ---------- parsing ----------
const LET = {'أ':0,'ا':0,'إ':0,'ب':1,'ج':2,'د':3,'A':0,'B':1,'C':2,'D':3,'a':0,'b':1,'c':2,'d':3};
const OPT_RE = /^\(?([أاإبجدA-Da-d])[\)\.]\s*(.*)$/;
const ANS_MARK = /\(?\s*الإجابة\s+الصحيحة[^)\n]*\)?/;
function parseSmart(text) {
  const all = []; let cur = null, inl = {};
  const mk = q => { cur = { q, options: [], correct: -1, exp: '', base: 0 }; all.push(cur); return cur; };
  for (const raw of text.replace(/&#x20;|&nbsp;/g, ' ').split('\n')) {
    let l = raw.replace(/\*\*|__/g, '').replace(/^\s*#+\s*/, '').trim();
    l = l.replace(/^[-•]\s+/, '').replace(/^\*\s+/, '').trim();
    if (!/[\u0600-\u06FFA-Za-z0-9]/.test(l) || /^!\[/.test(l) || /^image_\S*\.(png|jpe?g|webp)$/i.test(l)) continue;
    const star = /^\*/.test(l); if (star) l = l.slice(1).trim();
    let m = l.match(/^السؤال[^:：]{0,20}[:：]\s*(.*)$/);
    if (m) { cur = null; l = m[1].trim(); if (!l) continue; }
    l = l.replace(/^(?:ال|ل)?نص\s*[:：]\s*/, '');
    if (!l) continue;
    if (/^الإجابات\s*[:：]/.test(l)) {
      for (const k of l.matchAll(/(\d+)\s*[-–]\s*([أاإبجد])/g)) if (inl[k[1]]) inl[k[1]].correct = LET[k[2]];
      inl = {}; continue;
    }
    m = l.match(/^الإجابة(?:\s+الصحيحة)?\s*[:：]\s*(.*)$/);
    if (m) {
      const r = m[1].match(/^\(?([أاإبجد])[\)\.]?(?:\s|$)(.*)$/);
      if (r && cur) {
        cur.correct = LET[r[1]];
        const g = [...r[2].matchAll(/\(([^()]*)\)/g)].map(x => x[1].trim()).filter(Boolean).join(' ').replace(/[\.\s]+$/, '');
        if (g) cur.exp = g;
      }
      continue;
    }
    m = l.match(/^(?:شرح|التوضيح|توضيح|التفسير)\s*[:：]\s*(.+)$/);
    if (m) { if (cur) cur.exp = m[1].trim(); continue; }
    const marks = l.match(/\([أاإبجد]\)/g);
    if (marks && marks.length >= 3 && !OPT_RE.test(l)) {
      const parts = l.split(/\(([أاإبجد])\)/);
      let pre = parts[0].trim(), qn = null;
      const nm = pre.match(/^(\d+)\s*[\.\)\-]\s*(.*)$/); if (nm) { qn = nm[1]; pre = nm[2]; }
      const q = mk(pre);
      for (let i = 1; i < parts.length; i += 2) q.options.push((parts[i + 1] || '').trim());
      if (qn) inl[qn] = q;
      continue;
    }
    m = l.match(OPT_RE);
    if (m) {
      const li = LET[m[1]];
      if (!cur || li !== cur.base + cur.options.length) { mk(''); cur.base = li; }
      let t = m[2], ok = star;
      if (ANS_MARK.test(t)) { ok = true; t = t.replace(ANS_MARK, ''); }
      if (/[✅✔✓☑]/.test(t)) { ok = true; t = t.replace(/[✅✔✓☑]\uFE0F?/g, ''); }
      cur.options.push(t.trim());
      if (ok) cur.correct = cur.options.length - 1;
      continue;
    }
    if (!cur || cur.options.length) mk(l.replace(/^\d+\s*[\.\)\-]\s+/, ''));
    else cur.q += ' ' + l;
  }
  const qs = [], skipped = [];
  all.forEach(q => {
    if (!q.options.length) return;
    const lb = (q.q || '').slice(0, 45);
    if (!q.q) skipped.push('اختيارات بدون سؤال');
    else if (q.options.length < 2) skipped.push(lb + ' — اختيارات ناقصة');
    else qs.push({ q: q.q, options: q.options, correct: (q.correct >= 0 && q.correct < q.options.length) ? q.correct : -1, exp: q.exp || '' });
  });
  return { qs, skipped };
}
function parseSimple(t) {
  return t.trim().split(/\n\s*\n/).map(b => {
    const l = b.split('\n').map(s => s.trim()).filter(Boolean);
    const q = (l.shift() || '').replace(/^\d+\s*[\)\.\-]\s*/, '');
    let correct = -1, exp = '';
    const options = [];
    l.forEach(s => {
      const e = s.match(/^(?:شرح|توضيح)\s*[:：]\s*(.+)$/); if (e) { exp = e[1]; return; }
      if (s.startsWith('*')) { correct = options.length; s = s.slice(1).trim(); }
      options.push(s.replace(/^[A-Da-dأ-د]\s*[\)\.\-]\s*/, ''));
    });
    return { q, options, correct, exp };
  }).filter(x => x.q && x.options.length >= 2 && x.correct >= 0);
}
function parseQuestions(t) {
  const a = parseSmart(t), b = parseSimple(t);
  return a.qs.length >= b.length ? a : { qs: b, skipped: [] };
}
const shuffle = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

async function student(id) {
  const ref = db.collection('exams').doc(id);
  $app.innerHTML = WELCOME + '<p class="muted" style="text-align:center">جاري تحميل الامتحان...</p>';
  const slow = setTimeout(() => { $app.innerHTML = WELCOME + '<p class="err" style="text-align:center">الاتصال بطيء أو متحجب. افتح اللينك في Chrome، أو بدّل بين الواي فاي وداتا الموبايل، وجرّب تاني.</p>'; }, 12000);
  let snap;
  try { snap = await ref.get(); } finally { clearTimeout(slow); }
  if (!snap.exists) { $app.innerHTML = '<h1>الامتحان غير موجود</h1><p class="muted">اتأكد من اللينك اللي بعتهولك المدرس.</p>'; return; }
  const exam = snap.data();
  const key = 'exam_' + id;
  const saved = JSON.parse(localStorage.getItem(key) || 'null');
  if (saved) {
    const r = await ref.collection('results').doc(saved.rid).get();
    if (r.exists) {
      const d = r.data();
      return d.status === 'done' ? showResult(ref, exam, saved.rid, d) : runExam(ref, exam, saved.rid, d, key);
    }
  }
  if (exam.open === false) { $app.innerHTML = WELCOME + '<h1>الامتحان مغلق</h1><p class="muted">الامتحان ده اتقفل. كلم المدرس.</p>'; return; }
  const roster = exam.roster || [], hasCodes = roster.some(r => r.c);
  $app.innerHTML = WELCOME + `<h1>${esc(exam.title)}</h1>
   <div class="card"><p>${exam.questions.length} سؤال · ${exam.minutes} دقيقة</p>
   <div class="rules"><b>📌 تعليمات قبل ما تبدأ</b><ul>
    <li>العداد بيبدأ أول ما تضغط «ابدأ الامتحان».</li>
    <li>لو عملت ريفرش هتكمل من مكانك، والوقت بيفضل شغال.</li>
    <li>خروجك من صفحة الامتحان بيتسجل للمدرس.</li>
    <li>الامتحان بيتحل مرة واحدة بس، ولو دخلت تاني بنفس الاسم هتلاقي نتيجتك ومراجعتك.</li></ul></div>
   ${roster.length ? '<label>اختار اسمك من القايمة</label><select id="nm"><option value="">— اختار —</option>' + roster.map((r, i) => '<option value="' + i + '">' + esc(r.n) + '</option>').join('') + '</select>' : '<label>اسمك بالكامل</label><input id="nm" autocomplete="name">'}
   <button id="go">ابدأ الامتحان</button><p id="e" class="err"></p></div>`;
  document.getElementById('go').onclick = async () => {
    const v = document.getElementById('nm').value.trim(), eb = document.getElementById('e');
    let name, id;
    if (roster.length) {
      if (v === '') { eb.textContent = 'اختار اسمك من القايمة.'; return; }
      name = roster[+v].n; id = 'r' + v;
    } else { name = v; if (name.length < 3) { eb.textContent = 'اكتب اسمك بالكامل.'; return; } }
    if (!id) {
      const hid = x => { let h = 5381; for (const ch of x) h = ((h * 33) ^ ch.codePointAt(0)) >>> 0; return h.toString(36); };
      const k = name.replace(/\s+/g, ' ').trim().toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
      id = 'u_' + hid(k) + hid([...k].reverse().join(''));
    }
    const gb = document.getElementById('go'); gb.disabled = true; gb.textContent = 'جاري بدء الامتحان...';
    const data = { name, status: 'in_progress', startedAt: Date.now(), order: shuffle(exam.questions.length), answers: {}, leaves: 0,
      oo: Object.fromEntries(exam.questions.map((q, i) => [i, shuffle(q.options.length)])) };
    const dref = ref.collection('results').doc(id);
    let rd = data;
    try {
      const old = await dref.get();
      if (old.exists) rd = old.data(); else await dref.set(data);
    } catch (e) { gb.disabled = false; gb.textContent = 'ابدأ الامتحان'; eb.textContent = 'تعذر بدء الامتحان: ' + e.message; return; }
    localStorage.setItem(key, JSON.stringify({ rid: id }));
    return rd.status === 'done' ? showResult(ref, exam, id, rd) : runExam(ref, exam, id, rd, key);
  };
}

function runExam(ref, exam, rid, data, key) {
  const end = data.startedAt + exam.minutes * 60000;
  const answers = data.answers || {}, lk = 'ans_' + rid;
  try { Object.assign(answers, JSON.parse(localStorage.getItem(lk) || '{}')); } catch (e) {}
  let finished = false, t, leaves = data.leaves || 0;
  const onHide = () => { if (document.hidden && !finished) { leaves++; ref.collection('results').doc(rid).update({ leaves, answers }).catch(() => {}); } };
  document.addEventListener('visibilitychange', onHide);
  $app.innerHTML = `<div id="bar" style="margin:-20px -16px 16px"><span>${esc(data.name)}</span><span id="tm"></span><div id="prog"><i id="pf"></i></div></div>
   <div id="qs"></div><button id="fin">تسليم الامتحان</button> <span id="sv" class="muted"></span>`;
  const qs = document.getElementById('qs');
  const prog = () => { document.getElementById('pf').style.width = (Object.keys(answers).length / exam.questions.length * 100) + '%'; }; prog();
  data.order.forEach((qi, pos) => {
    const q = exam.questions[qi];
    const d = document.createElement('div');
    d.className = 'card q' + (answers[qi] !== undefined ? ' done' : '');
    d.innerHTML = `<b>${pos + 1}. ${esc(q.q)}</b>` + ((data.oo && data.oo[qi]) || q.options.map((_, k) => k)).map(oi =>
      `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${answers[qi] === oi ? 'checked' : ''}><span>${esc(q.options[oi])}</span></label>`).join('');
    d.onchange = e => {
      answers[qi] = +e.target.value; d.classList.add('done'); prog();
      try { localStorage.setItem(lk, JSON.stringify(answers)); } catch (e) {}
      clearTimeout(t);
      document.getElementById('sv').textContent = '';
      t = setTimeout(() => ref.collection('results').doc(rid).update({ answers }).then(() => document.getElementById('sv').textContent = 'تم حفظ إجاباتك').catch(() => {}), 20000);
    };
    qs.appendChild(d);
  });
  const finish = async () => {
    if (finished) return; finished = true; clearInterval(timerId); clearTimeout(t); document.removeEventListener('visibilitychange', onHide);
    let score = 0; exam.questions.forEach((q, i) => { if (answers[i] === q.correct) score++; });
    const upd = { status: 'done', answers, score, total: exam.questions.length, finishedAt: Date.now() };
    const doc = ref.collection('results').doc(rid);
    try { await doc.update(upd); } catch (e) {
      const cur = await doc.get().catch(() => null);
      if (cur && cur.exists && cur.data().status === 'done') { try { localStorage.removeItem(lk); } catch (_) {} return showResult(ref, exam, rid, cur.data()); }
      finished = false; document.addEventListener('visibilitychange', onHide);
      alert('تعذر تسليم الامتحان: ' + e.message + '\nإجاباتك محفوظة على جهازك. اتأكد من النت واضغط تسليم الامتحان تاني.');
      return;
    }
    try { localStorage.removeItem(lk); } catch (e) {}
    showResult(ref, exam, rid, { ...data, ...upd });
  };
  document.getElementById('fin').onclick = () => { if (confirm('تأكيد تسليم الامتحان؟')) finish(); };
  const tick = () => {
    const left = end - Date.now();
    document.getElementById('tm').textContent = fmt(left);
    document.getElementById('bar').classList.toggle('low', left < 60000);
    if (left <= 0) finish();
  };
  tick(); timerId = setInterval(tick, 1000);
}

function confetti() {
  const c = ['#7c5cff', '#ff5fa2', '#22d3ee', '#ffc83d', '#34d399'];
  for (let i = 0; i < 70; i++) {
    const e = document.createElement('i'); e.className = 'cf';
    e.style.cssText = `left:${Math.random() * 100}vw;background:${c[i % 5]};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * .6}s`;
    document.body.appendChild(e); setTimeout(() => e.remove(), 5500);
  }
}
async function showResult(ref, exam, rid, d) {
  const pct = Math.round(d.score / d.total * 100);
  let rankHtml = '', boardHtml = '';
  if (exam.showBoard) {
    const all = exam.boardMode === 'all';
    const rs = await boardData(ref, !all), pos = rs.findIndex(r => r.id === rid);
    rankHtml = pos >= 0 ? `<p style="font-weight:700;color:var(--amber)">ترتيبك: ${pos + 1}${all ? ' من ' + rs.length : ''}</p>` : '<p class="muted">إنت خارج أول 10 المرة دي.</p>';
    boardHtml = `<h2>${all ? 'ترتيب كل الطلاب' : 'أعلى 10 طلاب'}</h2>` + boardTable(rs, rid);
  }
  let html = `<h1>${esc(exam.title)}</h1><div class="card"><p>${esc(d.name)}</p>
   <div class="big" id="sc">0 / ${d.total}</div><p class="muted">${pct}%</p>${rankHtml}</div>`;
  if (exam.showReview !== false) html += '<h2>مراجعة الامتحان بإجاباتك</h2>' + exam.questions.map((q, i) => {
    const a = (d.answers || {})[i], ok = a === q.correct;
    return `<div class="card q" style="border-right-color:${ok ? 'var(--ok)' : 'var(--bad)'}"><b>${i + 1}. ${esc(q.q)}</b>` +
      q.options.map((o, j) => `<div class="rv ${j === q.correct ? 'c' : ''} ${j === a && !ok ? 'w' : ''}">${j === q.correct ? '✔ ' : j === a ? '✖ ' : '○ '}${esc(o)}${j === a ? ' (إجابتك)' : ''}</div>`).join('') +
      (a === undefined ? '<div class="err">ماجاوبتش على السؤال ده</div>' : '') + (q.exp ? '<div class="muted">' + esc(q.exp) + '</div>' : '') + '</div>';
  }).join('');
  $app.innerHTML = html + boardHtml;
  const el = document.getElementById('sc'), t0 = Date.now();
  const step = () => { const k = Math.min(1, (Date.now() - t0) / 1000); el.textContent = Math.round(d.score * k) + ' / ' + d.total; if (k < 1) requestAnimationFrame(step); };
  step(); if (pct >= 60) confetti();
}

async function boardData(ref, top) {
  const q = top ? ref.collection('results').orderBy('score', 'desc').limit(30) : ref.collection('results');
  const s = await q.get();
  lastIds = new Set(s.docs.map(x => x.id));
  const rs = s.docs.map(x => ({ id: x.id, ...x.data() })).filter(x => x.status === 'done')
    .sort((a, b) => b.score - a.score || (a.finishedAt - a.startedAt) - (b.finishedAt - b.startedAt));
  return top ? rs.slice(0, 10) : rs;
}
function boardTable(rs, me, adm) {
  return `<table><tr><th>#</th><th>الاسم</th><th>الدرجة</th><th>الوقت</th>${adm ? '<th>خرج من الصفحة</th>' : ''}</tr>` + rs.map((r, i) =>
    `<tr class="${r.id === me ? 'me' : ''}" style="--i:${i}"><td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${esc(r.name)}</td><td>${r.score}/${r.total}</td><td>${fmt(r.finishedAt - r.startedAt)}</td>${adm ? '<td>' + (r.leaves || 0) + ' مرة</td>' : ''}</tr>`).join('') + `</table>`;
}

// منع النسخ للطلاب فقط (مش في لوحة المدرس). ده بيمنع النسخ العادي بس، مش بيمنع الصور أو DevTools
function lockCopy() {
  document.body.classList.add('nocopy');
  const blockAll = e => e.preventDefault();
  // نسخ / قص / لصق / سحب / كليك يمين / تحديد: ممنوعين خالص (حتى جوه خانة الاسم)
  ['copy', 'cut', 'paste', 'contextmenu', 'dragstart', 'drop', 'selectstart'].forEach(ev => document.addEventListener(ev, blockAll, true));
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x', 'a', 'u', 's', 'p'].includes(k)) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(k)) e.preventDefault();
    if (e.shiftKey && e.key === 'Insert') e.preventDefault();
    if (e.key === 'F12') e.preventDefault();
    if (e.key === 'PrintScreen') { e.preventDefault(); try { navigator.clipboard.writeText(''); } catch (_) {} }
  }, true);
}
// الأدمن = اللينك فيه كلمة السر ومفيهوش ?exam. أي لينك امتحان (حتى لو حد ضاف كلمة الأدمن فيه) بيتقفل عليه النسخ
const isAdminView = params.has(ADMIN_KEY) && !params.has('exam');
if (!isAdminView) lockCopy();
if (!firebaseConfig.projectId) setup();
else if (typeof firebase === 'undefined') $app.innerHTML = WELCOME + '<p class="err" style="text-align:center">تعذر تحميل مكتبات Firebase. اتأكد من النت أو اقفل أي حاجب إعلانات وجرب تاني.</p>';
else {
  firebase.initializeApp(firebaseConfig); db = firebase.firestore(); db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); auth = firebase.auth();
  if (params.has('exam')) student(params.get('exam')).catch(e => $app.innerHTML = WELCOME + '<p class="err">تعذر تحميل الامتحان: ' + esc(e.message) + '</p><button onclick="location.reload()">حاول تاني</button>');
  else if (params.has(ADMIN_KEY)) {
    // لازم تسجيل دخول جديد في كل مرة تفتح فيها اللوحة في تبويب جديد (الجلسة بتنتهي بقفل التبويب)
    const go = () => auth.onAuthStateChanged(u => u ? dashboard() : login());
    if (sessionStorage.getItem('adm_ok')) go(); else auth.signOut().catch(() => {}).then(go);
  }
  else home().catch(e => $app.innerHTML = '<p class="err">حصل خطأ: ' + esc(e.message) + '</p>');
}
</script>
</body>
</html>
